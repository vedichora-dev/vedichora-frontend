name: Western Matchmaking Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BASE_URL: https://vedichora-frontend-orcin.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --legacy-peer-deps
      - run: npx playwright install chromium --with-deps
      - name: Create results dir
        run: mkdir -p test-results

      - name: Run western matchmaking tests
        run: |
          npx playwright test e2e/07-western.spec.js --reporter=list 2>&1 | tee western-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Push output to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          CONTENT=$(base64 -w 0 western-output.txt)
          EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/western-test-output.txt" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"message\":\"test: western results $(date +%H%M) [skip ci]\",\"content\":\"$CONTENT\",\"sha\":\"$EXISTING\"}" \
              "https://api.github.com/repos/$REPO/contents/western-test-output.txt" > /dev/null
          else
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"message\":\"test: western results $(date +%H%M) [skip ci]\",\"content\":\"$CONTENT\"}" \
              "https://api.github.com/repos/$REPO/contents/western-test-output.txt" > /dev/null
          fi

      - name: Push screenshots to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os, glob, base64, json, urllib.request

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]

          def api(method, path, body=None):
              url = f"https://api.github.com/repos/{repo}/{path}"
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github.v3+json",
                  "User-Agent": "VH/1",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, {}

          for f in sorted(glob.glob("test-results/W*.png")):
              name = os.path.basename(f)
              content = base64.b64encode(open(f, "rb").read()).decode()
              status, existing = api("GET", f"contents/test-screenshots/{name}")
              sha = existing.get("sha")
              body = {"message": f"ci: {name} [skip ci]", "content": content}
              if sha:
                  body["sha"] = sha
              status, _ = api("PUT", f"contents/test-screenshots/{name}", body)
              print(name, "->", status)
          PYEOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: western-test-${{ github.run_id }}
          path: |
            western-output.txt
            test-results/
          retention-days: 7
