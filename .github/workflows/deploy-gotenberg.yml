name: Deploy Gotenberg PDF Service

on:
  workflow_dispatch:

jobs:
  deploy-gotenberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Gotenberg to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # List projects to find our project
          railway whoami || echo "Auth check done"
          
          # Create gotenberg service with Docker image
          # Using railway service create with docker image
          railway add --image gotenberg/gotenberg:8 --name gotenberg 2>&1 || true
          
          # Get service status
          railway status 2>&1 || true

      - name: Get Gotenberg domain and set on Vercel
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Get the domain from railway
          DOMAIN=$(railway domain 2>&1 | grep -oP '[a-z0-9-]+\.up\.railway\.app' | head -1 || echo "")
          echo "Domain: $DOMAIN"
          
          if [ -n "$DOMAIN" ]; then
            # Get Vercel project ID
            PROJECT_ID=$(curl -s "https://api.vercel.com/v9/projects/vedichora-frontend-orcin" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
            
            echo "Vercel project: $PROJECT_ID"
            
            # Set env var
            curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"GOTENBERG_URL\",\"value\":\"https://$DOMAIN\",\"type\":\"plain\",\"target\":[\"production\",\"preview\",\"development\"]}"
            
            echo "✅ Set GOTENBERG_URL=https://$DOMAIN on Vercel"
            
            # Redeploy Vercel
            vercel --token=$VERCEL_TOKEN --prod --yes 2>&1 | tail -5 || true
          fi
