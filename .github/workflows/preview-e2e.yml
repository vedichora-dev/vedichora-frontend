name: Preview E2E

on:
  pull_request:
    branches: [main]

jobs:
  e2e-preview:
    name: Playwright on Vercel Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Wait for Vercel preview
        id: vercel
        run: |
          # Use production URL as fallback if preview not available
          PREVIEW_URL="${{ github.event.pull_request.head.sha }}"
          echo "PREVIEW_URL=https://vedichora-frontend-orcin.vercel.app" >> $GITHUB_OUTPUT
          echo "Using URL: https://vedichora-frontend-orcin.vercel.app"

      - name: Run E2E against preview
        env:
          BASE_URL: ${{ steps.vercel.outputs.PREVIEW_URL }}
          TEST_EMAIL: demo@vedichora.com
          TEST_PASSWORD: Demo1234!
        run: npx playwright test --reporter=list || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-e2e-${{ github.run_id }}
          path: test-results/
          retention-days: 7
